name: Apply Loftie-Eaton preliminary analysis

on:
  push:
    branches:
      - codex/loftie-eaton-preliminary-analysis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/loftie-eaton-preliminary-analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch proposal source
        run: |
          python scripts/apply_loftie_eaton_preliminary_analysis.py
          python scripts/fix_loftie_bib.py
      - name: Commit patched proposal
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- resistance_networks_full_proposal_v2.tex resistance_networks_full_proposal_v2.bib
            git commit -m 'Add preliminary Loftie-Eaton data analysis'
            git push
          fi
